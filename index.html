<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script type="module" src="script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<!-- Initialize theme on page load -->
<script>
  if (localStorage.getItem('theme') === 'dark') {
    document.documentElement.classList.add('dark');
  }
</script>
<link rel="stylesheet" href="styles.css">
<link rel="icon" type="image/png" href="images/favicon.png">
<title>Simple Notepad</title>

</head>

<body>

<main>
  <input id="noteTitle" data-i18n="untitledNote" data-i18n-placeholder="untitledNote" contenteditable="true">

  <div class="mainContainer">
    <aside class="sidebar">
      <ul id="notesList"></ul>
      <div class="trashWrapper">
        <button id="trashPanelButton" class="trashPanelButton" data-i18n="trashPanelButton"></button>
        <div id="trashOverlay" class="trashOverlay">
          <ul id="deletedNotesList"></ul>
        </div>
      </div>
    </aside>

    <div class="composer">
      <textarea id="textArea" data-i18n-placeholder="textArea" contenteditable="true"></textarea>
      <div class="actionButtons">
        <button id="saveButton" class="actionButton" data-i18n="saveButton"></button>
        <button id="trashButton" class="actionButton" data-i18n="trashButton"></button>
      </div>
    </div>
  </div>

  <button id="settingsButton" class="preferenceButton">
    <img src="images/settings.svg" alt="Settings">
  </button>

  <div id="settingsOverlay" class="settingsOverlay">
    <button id="themeButton" class="optionItem">
      <img id="themeIcon" src="images/moon.svg" alt="Switch Theme">
      <span data-i18n="themeButton"></span>
    </button>

    <button id="translateButton" class="optionItem">
      <img src="images/translate.svg" alt="Translate">
      <span data-i18n="translateButton"></span>
    </button>

    <fieldset id="translateOverlay" class="translateOverlay">
      <legend data-i18n="language"></legend>

      <label class="languageOption">
        <input id="english" type="radio" name="language" value="en" checked>
        English
      </label>

      <label class="languageOption">
        <input id="german" type="radio" name="language" value="de">
        Deutsch
      </label>

      <label class="languageOption">
        <input id="french" type="radio" name="language" value="fr">
        Français
      </label>

      <label class="languageOption">
        <input id="russian" type="radio" name="language" value="ru">
        Русский
      </label>
    </fieldset>

    <button id="changelogButton" class="optionItem">
      <img src="images/logs.svg" alt="Change logs">
      <span data-i18n="changelogButton"></span>
    </button>

    <fieldset id="changelogOverlay" class="changelogOverlay">
      <legend data-i18n="changelog"></legend>
      <p class="changelogVersion" data-version="2026.09.1"></p>
      <p class="changelogDate">06.09.2026</p>
      <ul class="changelog">
        <li data-i18n="changelogEntry8"></li>
      </ul>
      <p class="changelogVersion" data-version="2026.08.6"></p>
      <p class="changelogDate">19.08.2026</p>
      <ul class="changelog">
        <li data-i18n="changelogEntry4"></li>
      </ul>
      <p class="changelogVersion" data-version="2026.08.5"></p>
      <p class="changelogDate">06.08.2026</p>
      <ul class="changelog">
        <li data-i18n="changelogEntry11"></li>
        <li data-i18n="changelogEntry10"></li>
        <li data-i18n="changelogEntry2"></li>
      </ul>
      <p class="changelogVersion" data-version="2026.08.13"></p>
      <p class="changelogDate">30.07.2026</p>
      <ul class="changelog">
        <li data-i18n="changelogEntry7"></li>
      </ul>
      <p class="changelogVersion" data-version="2026.07.11"></p>
      <p class="changelogDate">14.07.2026</p>
      <ul class="changelog">
        <li data-i18n="changelogEntry5"></li>
        <li data-i18n="changelogEntry4"></li>
        <li data-i18n="changelogEntry6"></li>
      </ul>
      <p class="changelogVersion" data-version="2026.07.9"></p>
      <p class="changelogDate">11.07.2026</p>
      <ul class="changelog">
        <li data-i18n="changelogEntry2"></li>
      </ul>
      <p class="changelogVersion" data-version="2026.07.7"></p>
      <p class="changelogDate">09.07.2026</p>
      <ul class="changelog">
        <li data-i18n="changelogEntry1"></li>
        <li data-i18n="changelogEntry3"></li>
        <li data-i18n="changelogEntry4"></li>
      </ul>
    </fieldset>

    <button id="infoButton" class="optionItem">
      <img src="images/info.svg" alt="Info">
      <span data-i18n="infoButton"></span>
    </button>
    
    <fieldset id="infoOverlay" class="infoOverlay">
      <legend data-i18n="info"></legend>
      <p data-i18n="infoText"></p>
    </fieldset>

    <p id="charCounter"></p>
  </div>

  <div id="toast" class="toast"></div>

</main>

<footer>
  <p id="rights" data-i18n="rights"></p>
</footer>

</body>

</html>
